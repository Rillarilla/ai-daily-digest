name: AI Daily Digest

on:
  # 每天北京时间早上7点运行 (UTC 23:00 前一天)
  schedule:
    - cron: '0 23 * * *'

  # 手动触发
  workflow_dispatch:

jobs:
  send-digest:
    # Pin the release so ubuntu-latest migrations cannot change apt packages.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # WeasyPrint runtime dependencies (Python is provided by setup-python)
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0
          # Chinese fonts for PDF generation
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m weasyprint --info

      - name: Run AI Daily Digest
        env:
          # Gemini (Vertex AI) service account JSON
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}

          # Email configuration (Gmail SMTP)
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.SMTP_USER }}
          TO_EMAIL: rillahai@gmail.com

        run: |
          python main.py

      - name: Upload debug log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log
          path: |
            *.log
            debug/
          retention-days: 7
